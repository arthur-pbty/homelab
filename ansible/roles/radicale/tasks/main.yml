---
- name: Create Radicale directory
  ansible.builtin.file:
    path: /opt/radicale
    state: directory
    mode: "0755"

- name: Render Radicale docker-compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/radicale/docker-compose.yml
    mode: "0644"

- name: Start Radicale stack
  community.docker.docker_compose_v2:
    project_src: /opt/radicale
    state: present
