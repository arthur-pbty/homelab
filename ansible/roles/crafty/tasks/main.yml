---
- name: Create Crafty directory
  ansible.builtin.file:
    path: /opt/crafty
    state: directory
    mode: "0755"

- name: Render Crafty docker-compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/crafty/docker-compose.yml
    mode: "0644"

- name: Start Crafty stack
  community.docker.docker_compose_v2:
    project_src: /opt/crafty
    state: present
