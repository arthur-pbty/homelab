---
- name: Stop and disable systemd-resolved to free port 53
  ansible.builtin.systemd:
    name: systemd-resolved
    state: stopped
    enabled: false

- name: Create a proper resolv.conf
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    mode: "0644"
    content: |
      nameserver 8.8.8.8
      nameserver 1.1.1.1

- name: Create Pi-hole directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /opt/dns
    - /opt/dns/pihole
    - /opt/dns/dnsmasq

- name: Generate Pi-hole admin password
  ansible.builtin.set_fact:
    pihole_web_password: "{{ lookup('password', playbook_dir ~ '/.pihole_pass.txt length=16 chars=ascii_letters,digits') }}"

- name: Render Pi-hole docker-compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/dns/docker-compose.yml
    mode: "0644"

- name: Start Pi-hole stack
  community.docker.docker_compose_v2:
    project_src: /opt/dns
    state: present

- name: Wait for Pi-hole to be ready
  ansible.builtin.command:
    cmd: docker exec pihole pihole status
  register: pihole_status
  until: pihole_status.rc == 0
  retries: 10
  delay: 5
  changed_when: false

- name: Force set Pi-hole admin password (v5 compat, may fail on v6 - env var handles it)
  ansible.builtin.command:
    cmd: "docker exec pihole pihole setpassword {{ pihole_web_password }}"
  changed_when: false
  failed_when: false

- name: Add adblock lists to Pi-hole gravity database
  ansible.builtin.shell: |
    docker exec pihole pihole-FTL sqlite3 /etc/pihole/gravity.db \
      "INSERT OR IGNORE INTO adlist (address, type, enabled) VALUES ('{{ item }}', 0, 1); SELECT changes();"
  register: adlist_result
  changed_when: "adlist_result.stdout | trim == '1'"
  loop:
    - "https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts"
    - "https://v.firebog.net/hosts/AdguardDNS.txt"
    - "https://v.firebog.net/hosts/Easylist.txt"
    - "https://v.firebog.net/hosts/Easyprivacy.txt"
    - "https://v.firebog.net/hosts/Prigent-Ads.txt"
    - "https://v.firebog.net/hosts/Prigent-Malware.txt"
    - "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/domains/pro.txt"

# FIX v6 : Ajout de la colonne 'id' pour correspondre au schéma attendu par FTL
- name: Add local DNS records to Pi-hole FTL database
  ansible.builtin.shell: |
    docker exec pihole pihole-FTL sqlite3 /etc/pihole/pihole-FTL.db \
      "CREATE TABLE IF NOT EXISTS domain_mapping (id INTEGER PRIMARY KEY AUTOINCREMENT, ip TEXT NOT NULL, domain TEXT NOT NULL, UNIQUE(ip, domain)); INSERT OR IGNORE INTO domain_mapping (ip, domain) VALUES ('{{ item.ip }}', '{{ item.host }}'); SELECT changes();"
  register: dns_result
  changed_when: "dns_result.stdout | trim == '1'"
  loop:
    - { ip: "{{ groups['network'][0] | trim }}", host: "pihole.{{ homelab_domain }}" }
    - { ip: "{{ groups['media'][0] | trim }}",  host: "immich.{{ homelab_domain }}" }
    - { ip: "{{ groups['media'][0] | trim }}",  host: "jellyfin.{{ homelab_domain }}" }
    - { ip: "{{ groups['media'][0] | trim }}",  host: "navidrome.{{ homelab_domain }}" }
    - { ip: "{{ groups['media'][0] | trim }}",  host: "gokapi.{{ homelab_domain }}" }
    - { ip: "{{ groups['apps'][0] | trim }}",   host: "gitea.{{ homelab_domain }}" }
    - { ip: "{{ groups['apps'][0] | trim }}",   host: "searxng.{{ homelab_domain }}" }
    - { ip: "{{ groups['apps'][0] | trim }}",   host: "uptimekuma.{{ homelab_domain }}" }
    - { ip: "{{ groups['apps'][0] | trim }}",   host: "radicale.{{ homelab_domain }}" }
    - { ip: "{{ groups['apps'][0] | trim }}",   host: "joplin.{{ homelab_domain }}" }
    - { ip: "{{ groups['apps'][0] | trim }}",   host: "shlink.{{ homelab_domain }}" }
    - { ip: "{{ groups['apps'][0] | trim }}",   host: "speedtest.{{ homelab_domain }}" }
    - { ip: "{{ groups['apps'][0] | trim }}",   host: "crafty.{{ homelab_domain }}" }
  notify: Restart Pi-hole DNS

# FIX : On force la mise à jour des listes (pihole -g) à chaque exécution
- name: Force update Pi-hole Gravity
  ansible.builtin.command:
    cmd: docker exec pihole pihole -g
  changed_when: false

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Display Pi-hole admin password
  ansible.builtin.debug:
    msg: "🔑 Ton mot de passe Pi-hole est : {{ pihole_web_password }}"
