---
# ==========================================
# 1. CONFIGURATION DE LA VM DE TEST
# ==========================================
- name: Setup Base OS & Docker
  hosts: test_vm
  become: true
  tasks:
    - name: Install prerequisites for Docker repo
      ansible.builtin.apt:
        name: [ca-certificates, curl, gnupg, lsb-release]
        state: present
        update_cache: true

    - name: Add Docker official GPG key
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker Engine and Compose plugin
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin, python3-docker]
        state: present
        update_cache: true

    - name: Ensure Docker service is started and enabled
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true
        daemon_reload: true

# ==========================================
# 2. DEPLOIEMENT D'UN SERVICE DE TEST
# ==========================================
- name: Deploy Traefik
  hosts: test_vm
  become: true
  tasks:
    - name: Create Traefik directory
      ansible.builtin.file:
        path: /opt/traefik
        state: directory
        mode: "0755"

    - name: Copy Traefik docker-compose file
      ansible.builtin.copy:
        dest: /opt/traefik/docker-compose.yml
        mode: "0644"
        content: |
          services:
            traefik:
              image: traefik:v3.0
              ports: ["80:80", "8080:8080"]
              volumes:
                - /var/run/docker.sock:/var/run/docker.sock:ro
                - ./traefik.yml:/etc/traefik/traefik.yml:ro
              restart: unless-stopped

    - name: Deploy Traefik Container
      community.docker.docker_compose_v2:
        project_src: /opt/traefik
        state: present
